name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['5.1', '5.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - name: Syntax and regression checks
        env:
          LUA_BIN: lua${{ matrix.lua }}
          LUAC_BIN: luac${{ matrix.lua }}
        run: sh scripts/check.sh
      - name: Build plugin package
        run: python3 scripts/package.py
